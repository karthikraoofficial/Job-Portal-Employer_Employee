# Optional: a full PostgreSQL server.
#
# Day-to-day development does not need this - `npm run db:start` runs a local
# Postgres with no Docker at all. Use this file when you want:
#
#   * versioned migrations (`npm run db:migrate`), which the lightweight local
#     server cannot do because it has no support for creating the scratch
#     "shadow" database that Prisma migrations require, or
#   * a setup identical to production.
#
# Start it with:  docker compose up -d
# Then set this in .env:
#   DATABASE_URL="postgres://jobportal:jobportal@localhost:5432/jobportal"
#   SHADOW_DATABASE_URL="postgres://jobportal:jobportal@localhost:5432/jobportal_shadow"

services:
  postgres:
    image: postgres:17-alpine
    container_name: jobportal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobportal
      POSTGRES_PASSWORD: jobportal
      POSTGRES_DB: jobportal
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the shadow database Prisma migrations need, on first start only.
      - ./docker/init-shadow-db.sql:/docker-entrypoint-initdb.d/init-shadow-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jobportal -d jobportal']
      interval: 5s
      timeout: 5s
      retries: 10

  # A small web UI for browsing the database at http://localhost:8080
  # (System: PostgreSQL, Server: postgres, User/Password/Database: jobportal)
  adminer:
    image: adminer:latest
    container_name: jobportal-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
